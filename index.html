<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudLab Free — OCI-inspired cloud learning environment</title>
<style>
:root{--red:#c74634;--red-d:#a53a2b;--red-l:#fbeceb;--navy:#161e2c;--navy2:#212b3d;--bg:#f3f4f6;--card:#fff;--line:#e0e4ea;--text:#1d2433;--muted:#566175;--ok:#17803d;--ok-l:#e5f5ea;--warn:#a5530a;--warn-l:#fdf1df;--err:#b42318;--err-l:#fde8e6;--info:#1d5fbf;--info-l:#e6effb;--r:12px;--hdrH:70px;--sh:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.06)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:15px;overflow-x:hidden}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0 0 .8em}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2a6fdb;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:8px 12px;z-index:200}.skip:focus{left:8px;top:8px}
.sticky{position:sticky;top:0;z-index:60}
.notice{background:#fff7e0;color:#5c3d00;border-bottom:1px solid #f1d58a;font-size:12px;padding:6px 14px;text-align:center;font-weight:600;letter-spacing:.01em}
.notice b{color:var(--red-d)}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;transition:background .15s,border-color .15s;min-height:38px;text-decoration:none}
.btn:hover{background:#f3f5f8}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.primary:hover{background:var(--red-d)}
.btn.danger{color:var(--err);border-color:#f0b9b4}.btn.danger:hover{background:var(--err-l)}
.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.dark:hover{background:var(--navy2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn.lg{padding:12px 22px;font-size:16px;min-height:46px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--red-l);color:var(--red-d);letter-spacing:.04em;text-transform:uppercase}
.chip.gray{background:#eceff3;color:#44506a}
.sim{font-size:10px;font-weight:800;background:#eef1f6;color:#44506a;border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:middle;letter-spacing:.05em}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;min-width:0}
.card h2,.card h3{margin-bottom:.7em}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.callout{border-radius:10px;padding:12px 14px;border:1px solid;margin:0 0 16px;font-size:14px}
.callout.info{background:var(--info-l);border-color:#b9d1f3;color:#123e80}
.callout.warn{background:var(--warn-l);border-color:#f0cf9a;color:#68380a}
.callout.err{background:var(--err-l);border-color:#f0b9b4;color:#7c1a12}
.callout.ok{background:var(--ok-l);border-color:#a8dbb9;color:#0f5a29}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;border:1px solid}
.badge.ok{background:var(--ok-l);color:var(--ok);border-color:#a8dbb9}.badge.gray{background:#eceff3;color:#44506a;border-color:#d5dae3}
.badge.info{background:var(--info-l);color:var(--info);border-color:#b9d1f3}.badge.err{background:var(--err-l);color:var(--err);border-color:#f0b9b4}.badge.warn{background:var(--warn-l);color:var(--warn);border-color:#f0cf9a}
.spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
/* forms */
.fg{margin-bottom:14px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
input[type=text],input[type=password],input[type=email],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid #bcc4d0;border-radius:8px;background:#fff;min-height:40px}
input[type=file]{max-width:100%}
input.bad,select.bad{border-color:var(--err);background:#fff8f7}
.hint{font-size:12.5px;color:var(--muted);margin-top:3px}
.err{font-size:13px;color:var(--err);margin-top:3px;font-weight:600}
.pwrow{display:flex;gap:8px}.pwrow input{flex:1}
.meter{height:6px;border-radius:4px;background:#e5e8ee;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;width:0;background:var(--err);transition:width .2s,background .2s}
.checkrow{display:flex;gap:10px;align-items:flex-start}.checkrow input{margin-top:4px;width:18px;height:18px}
/* progress */
.prog{height:10px;background:#e8ebf0;border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);border-radius:8px;transition:width .3s}
.prog.warn i{background:#d98a1a}.prog.err i{background:var(--err)}
.pitem{margin-bottom:14px}.pitem .row{margin-bottom:4px;font-size:14px}
/* tables */
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#fafbfc}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}.empty h3{color:var(--text)}
.loader{display:flex;gap:10px;align-items:center;justify-content:center;padding:60px;color:var(--muted)}
.loader .spin{width:20px;height:20px}
/* public */
.pubhdr{background:var(--navy);color:#fff}
.pubhdr .in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;background:none;border:0;cursor:pointer;text-align:left;padding:0}
.brand .logo{width:36px;height:36px;border-radius:9px;background:var(--red);display:grid;place-items:center}
.brand .logo svg{stroke:#fff}
.brand b{display:block;font-size:17px;line-height:1.1}.brand small{font-size:11px;color:#b8c2d6;display:block}
.pubnav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.pubnav button{background:none;border:0;color:#d6dcea;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600}.pubnav button:hover{background:var(--navy2);color:#fff}
.hero{background:linear-gradient(135deg,#161e2c 0%,#2a1f2e 60%,#4a2420 100%);color:#fff;padding:64px 20px}
.hero .in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.2fr .8fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);margin-bottom:.4em}
.hero p{color:#d6dcea;font-size:1.1rem;max-width:56ch}
.hero .art{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:18px}
.sect{max-width:1180px;margin:0 auto;padding:44px 20px}
.sect>h2{font-size:1.6rem}
.feat .ic{width:44px;height:44px;border-radius:10px;background:var(--red-l);color:var(--red-d);display:grid;place-items:center;margin-bottom:10px}
.quota{font-size:2rem;font-weight:800;color:var(--red-d)}
.foot{background:var(--navy);color:#b8c2d6;padding:28px 20px;font-size:14px}
.foot .in{max-width:1180px;margin:0 auto}
.foot button{background:none;border:0;color:#fff;cursor:pointer;text-decoration:underline;padding:4px 8px;font-size:14px}
.wizard{max-width:760px;margin:30px auto;padding:0 16px}
.stepper{display:flex;gap:6px;margin:0 0 18px;padding:0;list-style:none}
.stepper li{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--muted);border-top:4px solid #d5dae3;padding-top:6px}
.stepper li.on{color:var(--red-d);border-color:var(--red)}.stepper li.done{color:var(--ok);border-color:var(--ok)}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}.dl dt{color:var(--muted);font-size:13px}.dl dd{margin:0;font-weight:600;word-break:break-word}
/* console */
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:nowrap}
.topbar .brand{margin-right:6px}
.topbar .btn{background:transparent;color:#e6ebf6;border-color:#3a475f}.topbar .btn:hover{background:var(--navy2)}
.topbar .iconbtn{padding:6px 9px}
.searchbox{position:relative;flex:1;max-width:420px;min-width:0}
.searchbox input{background:#2a3548;border-color:#3a475f;color:#fff;padding-left:34px}.searchbox input::placeholder{color:#a9b4c9}
.searchbox .icon{position:absolute;left:10px;top:11px;color:#a9b4c9;pointer-events:none}
.regionsel{background:#2a3548;color:#fff;border-color:#3a475f;max-width:210px;font-size:13px}
.dd{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;color:var(--text);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(16,24,40,.22);min-width:230px;max-width:min(360px,92vw);z-index:70;padding:6px;max-height:70vh;overflow:auto}
.pop[hidden]{display:none}
.searchbox .pop{left:0;right:auto;width:100%;min-width:260px}
.mi{display:flex;width:100%;text-align:left;gap:8px;padding:8px 10px;border:0;background:none;border-radius:6px;cursor:pointer;align-items:center;color:var(--text)}.mi:hover,.mi:focus-visible{background:#f0f2f6}
.mi small{display:block;color:var(--muted)}
.pop .head{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 10px}
.badgecount{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - var(--hdrH))}
.sidebar{background:var(--navy);color:#cfd6e6;position:sticky;top:var(--hdrH);height:calc(100vh - var(--hdrH));overflow:auto;padding:12px 8px}
.sidebar button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:600;margin-bottom:2px;border-left:3px solid transparent}
.sidebar button:hover{background:var(--navy2);color:#fff}
.sidebar button.on{background:var(--navy2);color:#fff;border-left-color:var(--red)}
.sidebar .sep{border-top:1px solid #2d384d;margin:10px 6px;padding-top:10px;font-size:11px;color:#8d9ab2}
.main{padding:22px;min-width:0;max-width:1300px;width:100%}
.pagehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{margin:0}
.stat{display:flex;flex-direction:column;gap:2px}.stat .v{font-size:1.7rem;font-weight:800}.stat .l{color:var(--muted);font-size:13px;font-weight:600}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input[type=text]{max-width:280px}.toolbar select{width:auto}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected=true]{color:var(--red-d);border-color:var(--red)}
.feed{list-style:none;margin:0;padding:0}.feed li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.feed li:last-child{border:0}
.check{list-style:none;margin:0;padding:0}.check li{display:flex;gap:10px;align-items:center;padding:6px 0}
.check .box{width:20px;height:20px;border-radius:50%;border:2px solid #b5bdca;display:grid;place-items:center;flex:none}.check .done .box{background:var(--ok);border-color:var(--ok);color:#fff}.check .box .icon{width:13px;height:13px;stroke-width:3}
.legend{display:flex;flex-direction:column;gap:6px;font-size:14px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px}
.logs{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;max-height:420px;overflow:auto;background:#0f1522;color:#d6dcea;border-radius:10px;padding:10px}
.logs div{padding:2px 0;white-space:pre-wrap;word-break:break-word}
.sev{display:inline-block;min-width:52px;font-weight:700}.sev.INFO{color:#6fb1ff}.sev.WARN{color:#f5b84a}.sev.ERROR{color:#ff7b72}.sev.DEBUG{color:#9aa6bd}
.chartbox svg{width:100%;height:auto;display:block}
.lesson{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fff}.lesson.done{border-color:#a8dbb9;background:#f6fcf8}
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.55);display:grid;place-items:center;z-index:100;padding:14px}
.modal{background:#fff;border-radius:14px;width:min(520px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}.modal.wide{width:min(760px,100%)}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.modal header h2{margin:0}
.modal .mb{padding:18px;overflow:auto}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
pre.json{background:#0f1522;color:#d6dcea;padding:12px;border-radius:8px;max-height:50vh;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:150;max-width:min(380px,calc(100vw - 28px))}
.toast{background:var(--navy);color:#fff;padding:11px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);border-left:5px solid #6fb1ff;font-size:14px;animation:tin .2s}
.toast.ok{border-color:#3fbf6b}.toast.warn{border-color:#f5b84a}.toast.err{border-color:#ff7b72}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.menubtn{display:none}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.hero .in{grid-template-columns:1fr}}
@media(max-width:820px){
 .layout{grid-template-columns:minmax(0,1fr)}
 .menubtn{display:inline-flex}
 .sidebar{position:fixed;left:0;top:var(--hdrH);width:260px;z-index:55;transform:translateX(-102%);transition:transform .2s}.sidebar.open{transform:none;box-shadow:6px 0 24px rgba(0,0,0,.35)}
 .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
 .regionsel,.hide-sm{display:none}
 .topbar{gap:6px;padding:8px}
 .main{padding:14px}
 .brand small{display:none}
 .topbar .brand b{font-size:15px}
 table.tbl thead{display:none}
 table.tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
 .tbl tr{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 4px;background:#fff}
 .tbl td{border:0;padding:6px 10px;display:flex;gap:10px;justify-content:space-between;align-items:center;text-align:right}
 .tbl td::before{content:attr(data-label);font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;text-align:left}
 .tbl td .acts{justify-content:flex-end}
 .dl{grid-template-columns:1fr}.dl dt{margin-top:6px}
}
@media(max-width:480px){.notice{font-size:11px}.pubnav{margin-left:0}.hero{padding:40px 16px}.row.stackm{flex-direction:column;align-items:stretch}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---- Billing & Payments ---- */
.paynotice{background:#fff3cd;border:2px solid #e0a800;color:#5c3d00;font-weight:800;text-align:center;padding:10px 14px;border-radius:10px;margin-bottom:16px;letter-spacing:.02em}
.subnav{display:none;margin:0 0 4px 14px;border-left:1px solid #2d384d}
.sidebar .subnav button{font-size:13px;padding:6px 10px;font-weight:500;border-left:0;margin:0}
.sidebar .subnav button.on{color:#fff;background:var(--navy2);box-shadow:inset 3px 0 0 var(--red)}
.paycard{background:linear-gradient(135deg,var(--cc,#1a3a8f),#161e2c);color:#fff;border-radius:16px;padding:18px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;box-shadow:var(--sh);max-width:100%}
.paycard .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.25rem;letter-spacing:.08em;overflow-wrap:anywhere}
.paycard .ribbon{background:#fff;color:#a53a2b;font-weight:800;font-size:11px;padding:3px 8px;border-radius:6px;letter-spacing:.04em}
.pcard{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;border:2px solid var(--line);font:inherit;color:inherit}
.pcard[aria-pressed=true]{border-color:var(--red);background:var(--red-l)}
.mrow{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
.mrow input{width:18px;height:18px}
.invoice{background:#fff;color:#111;border:1px solid var(--line);border-radius:8px;padding:20px}
.invwm{margin:12px 0;padding:8px;border:2px dashed #a53a2b;color:#a53a2b;font-weight:800;text-align:center;font-size:13px}
.invt{width:100%;border-collapse:collapse;margin:14px 0}.invt th,.invt td{border-bottom:1px solid #ccc;padding:8px;text-align:left}.invt .r{text-align:right}
.tot{margin-left:auto;max-width:320px}.tot div{display:flex;justify-content:space-between;padding:4px 0}.tot .grand{border-top:2px solid #111;font-weight:800;font-size:1.1rem;margin-top:4px;padding-top:8px}
#printarea{display:none}
@media(max-width:820px){#cogrid{grid-template-columns:minmax(0,1fr)!important}}
@media print{
 body>*:not(#printarea){display:none!important}
 #printarea{display:block!important;position:static}
 body{background:#fff}
}

/* ---- Courses, admin, theme ---- */
.adminmain{max-width:1200px;margin:0 auto;padding:22px;width:100%}
@media(max-width:820px){.adminmain{padding:14px}}
:root[data-theme=dark]{--bg:#0d121c;--card:#172030;--line:#2b3a52;--text:#e6ebf6;--muted:#9fb0cb;--red-l:#3a1d1a;--red-d:#ff8a78;--ok:#4cc57d;--ok-l:#12301f;--warn:#f0b35a;--warn-l:#33270f;--err:#ff8a80;--err-l:#3a1815;--info:#7fb2ff;--info-l:#14233d;--sh:0 1px 2px rgba(0,0,0,.4)}
:root[data-theme=dark] body{background:var(--bg);color:var(--text)}
:root[data-theme=dark] .btn{background:var(--card);color:var(--text);border-color:var(--line)}
:root[data-theme=dark] .btn:hover{background:#223049}
:root[data-theme=dark] .btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
:root[data-theme=dark] .btn.dark{background:var(--navy);color:#fff}
:root[data-theme=dark] .topbar .btn,:root[data-theme=dark] .btn.ghost{background:transparent}
:root[data-theme=dark] input[type=text],:root[data-theme=dark] input[type=password],:root[data-theme=dark] input[type=email],:root[data-theme=dark] input[type=number],:root[data-theme=dark] input[type=date],:root[data-theme=dark] select,:root[data-theme=dark] textarea{background:#0f1726;color:var(--text);border-color:#3a4c68}
:root[data-theme=dark] .searchbox input{background:#2a3548}
:root[data-theme=dark] .modal,:root[data-theme=dark] .pop,:root[data-theme=dark] .lesson,:root[data-theme=dark] .tbl tr{background:var(--card);color:var(--text)}
:root[data-theme=dark] .mi{color:var(--text)}:root[data-theme=dark] .mi:hover{background:#223049}
:root[data-theme=dark] .tbl tr:hover td{background:#1c283b}
